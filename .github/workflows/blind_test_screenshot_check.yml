name: 盲测截图校验

on:
  schedule:
    - cron: '0 10 * * 1,3,5'   # UTC 10点 = 北京时间18点，周一/三/五
  workflow_dispatch:
    inputs:
      force_send:
        description: '非周一三五也强制执行，填 true'
        required: false
        default: ''
      dry_run:
        description: '只打印报告不发群，填 true'
        required: false
        default: ''
      test_group:
        description: '发到测试群（BEEHIVE_WEBHOOK）而不是正式群，填 true'
        required: false
        default: ''
      max_download:
        description: '单次最多下载多少张图做尺寸检查（默认300）'
        required: false
        default: ''
      scope:
        description: '校验范围：all=总验收列+所有轮次（默认）/ round=只看当前这一轮发版'
        required: false
        default: ''
      dm:
        description: '明细发私信：true=按人飞书私信+群里只放总数（默认）/ false=群里发完整明细'
        required: false
        default: ''
      groups:
        description: '白名单：只校验这几个分组，逗号分隔。临时查看用，留空=全部'
        required: false
        default: ''
      exclude_groups:
        description: '黑名单：不催这几个分组，逗号分隔。留空=用下面的默认值'
        required: false
        default: ''
      ignore:
        description: '加白：确认没问题的图片编号（报告里的 [xxxxxxxx]），逗号分隔，以后不再报'
        required: false
        default: ''
      unignore:
        description: '取消加白：同样填图片编号，逗号分隔'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python blind_test_screenshot_check.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          # 默认发正式群；手动触发时填 test_group=true 可以改发测试群
          BEEHIVE_WEBHOOK: ${{ github.event.inputs.test_group == 'true' && secrets.BEEHIVE_WEBHOOK || secrets.BEEHIVE_WEBHOOK_PRODUCT }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_DOWNLOAD: ${{ github.event.inputs.max_download }}
          SCOPE: ${{ github.event.inputs.scope || 'all' }}
          # 2026-11 现状：第1/2次发版的欠账不补了，只催总验收的 Mac + iPhone。
          # 等以后要恢复催各轮发版，把这里的默认值改成空字符串即可。
          GROUPS: ${{ github.event.inputs.groups }}
          # 2026-11 的决定：第1/2次发版的欠账不补了，只催总验收 + 以后的新轮次。
          # 用黑名单而不是白名单，这样第3次发版（预计 11-19）上线后会自动开始催，
          # 不用回来改配置。要恢复催第1/2次，把这里的默认值改成空字符串。
          EXCLUDE_GROUPS: ${{ github.event.inputs.exclude_groups || '第1次发版,第2次发版' }}
          # 明细按人私信（走飞书，蜂巢还没有私信能力），群里只发总数
          DM: ${{ github.event.inputs.dm || 'true' }}
          IGNORE: ${{ github.event.inputs.ignore }}
          UNIGNORE: ${{ github.event.inputs.unignore }}
      - name: 提交图片尺寸缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshot_state.json
          git diff --staged --quiet || git commit -m "更新截图尺寸缓存 $(date +'%Y-%m-%d')"
          git push
