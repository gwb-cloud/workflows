name: 盲测截图校验

on:
  schedule:
    - cron: '0 10 * * 1,3,5'   # UTC 10点 = 北京时间18点，周一/三/五
  workflow_dispatch:
    inputs:
      force_send:
        description: '非周一三五也强制执行，填 true'
        required: false
        default: ''
      dry_run:
        description: '只打印报告不发群，填 true'
        required: false
        default: ''
      max_download:
        description: '单次最多下载多少张图做尺寸检查（默认300）'
        required: false
        default: ''
      scope:
        description: '校验范围：all=总验收列+所有轮次（默认）/ round=只看当前这一轮发版'
        required: false
        default: ''
      vision:
        description: '开视觉校验（判"不是界面截图"和"放错端"），填 true。需要 DASHSCOPE_API_KEY'
        required: false
        default: ''
      max_vision:
        description: '本次最多用视觉判多少张（默认400）。第一次建议先填 20 验证效果'
        required: false
        default: ''
      dm:
        description: '明细发私信：true=按人飞书私信+群里只放总数（默认）/ false=群里发完整明细'
        required: false
        default: ''
      groups:
        description: '白名单：只校验这几个分组，逗号分隔。临时查看用，留空=全部'
        required: false
        default: ''
      exclude_groups:
        description: '黑名单：不催这几个分组，逗号分隔。留空=用下面的默认值'
        required: false
        default: ''
      ignore:
        description: '加白：确认没问题的图片编号（报告里的 [xxxxxxxx]），逗号分隔，以后不再报'
        required: false
        default: ''
      unignore:
        description: '取消加白：同样填图片编号，逗号分隔'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python blind_test_screenshot_check.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          # 验收群的【盲测】机器人。原来有个 test_group 开关号称发"测试群"，
          # 但那个 BEEHIVE_WEBHOOK 其实就是验收群，等于没有测试群，已删掉。
          # 想先看效果就用 dry_run=true，只打印不发送。
          BEEHIVE_WEBHOOK: ${{ secrets.BEEHIVE_WEBHOOK_MANGCE }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_DOWNLOAD: ${{ github.event.inputs.max_download }}
          # 视觉校验默认关着。验证没问题后把下面的 vision 默认值改成 'true' 就常开，
          # 判定按 file_token 永久缓存，每张图只花一次钱。
          VISION: ${{ github.event.inputs.vision }}
          MAX_VISION: ${{ github.event.inputs.max_vision }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SCOPE: ${{ github.event.inputs.scope || 'all' }}
          # 2026-11-27 起：只催总验收，各次发版一律不催。
          #
          # 这里**故意用白名单**，跟 11-13 那次的结论相反，因为策略方向反过来了：
          # 当时要"以后的新轮次自动开始催"，白名单会把第3次发版静默挡掉，所以改黑名单；
          # 现在发版抽检打标已停用（2026-11-20），不会再有新轮次产生，
          # 要表达的是"永远只看总验收"——这正是白名单的语义，列第N次发版的黑名单
          # 反而要每出一轮补一次，迟早漏。
          # 要恢复催各轮发版：把默认值改回空字符串（SCOPE=all 就会覆盖全部轮次）。
          GROUPS: ${{ github.event.inputs.groups || '总验收' }}
          # 黑名单不再需要（白名单已经只剩总验收了），留着给临时排查用。
          EXCLUDE_GROUPS: ${{ github.event.inputs.exclude_groups }}
          # 明细按人私信（走飞书，蜂巢还没有私信能力），群里只发总数
          DM: ${{ github.event.inputs.dm || 'true' }}
          IGNORE: ${{ github.event.inputs.ignore }}
          UNIGNORE: ${{ github.event.inputs.unignore }}
      - name: 提交图片尺寸缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshot_state.json
          git diff --staged --quiet || git commit -m "更新截图尺寸缓存 $(date +'%Y-%m-%d')"
          git push
