name: 月度盲测建表分人

on:
  schedule:
    - cron: '0 1 1 * *'   # UTC 1点 = 北京时间上午9点，每月1日执行
  workflow_dispatch:        # 首次调试务必用这个手动触发，观察日志

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python monthly_blind_test_setup.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
