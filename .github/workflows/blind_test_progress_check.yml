name: 盲测完成情况校验

on:
  schedule:
    - cron: '0 11 * * 1-5'   # UTC 11点 = 北京时间晚上19点，周一到周五（周末不发）
  workflow_dispatch:
    inputs:
      force_send:
        description: '周末也强制发送，填 true'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python blind_test_progress_check.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          BEEHIVE_WEBHOOK_P2_WORKFLOW: ${{ secrets.BEEHIVE_WEBHOOK_P2_WORKFLOW }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
      - name: 提交状态快照文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blind_test_state.json
          git diff --staged --quiet || git commit -m "更新盲测每日快照 $(date +'%Y-%m-%d')"
          git push
