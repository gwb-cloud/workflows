name: 问题池规则巡检

on:
  schedule:
    - cron: '0 2 * * 1'    # UTC 2点 = 北京时间周一上午10点
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不发群，填 true'
        required: false
        default: ''
      max_keys:
        description: '每条规则最多列几个主键（默认12）'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python issue_field_audit.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          BEEHIVE_WEBHOOK: ${{ secrets.BEEHIVE_WEBHOOK_WENTI }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_KEYS: ${{ github.event.inputs.max_keys }}
