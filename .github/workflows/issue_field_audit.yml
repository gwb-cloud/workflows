name: 验收问题表字段巡检

on:
  schedule:
    - cron: '0 2 * * 1'    # UTC 2点 = 北京时间周一上午10点
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不发群，填 true'
        required: false
        default: ''
      key_fields:
        description: '重点提醒的字段，逗号分隔；留空用默认的那几个'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python issue_field_audit.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          BEEHIVE_WEBHOOK: ${{ secrets.BEEHIVE_WEBHOOK }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          KEY_FIELDS: ${{ github.event.inputs.key_fields }}
