name: 发版抽检打标

on:
  # 2026-11-20 停用定时触发：总验收本身还在 40% 水位（两人整月零进度），
  # 再往表里塞「第N次发版-待验收」只会让分母更难看。11 月第1/2次发版的欠账也已
  # 明确不补（见 blind_test_screenshot_check.yml 的 EXCLUDE_GROUPS 默认值）。
  # 想恢复：解开下面这行即可，脚本本身是好的。
  # schedule:
  #   - cron: '0 3 * * 1-5'   # UTC 3点 = 北京时间上午11点，周一到周五
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定要打标的发布日期（必须是节点更新总表里已填的版本发布日期），格式 2026-09-03，留空则自动取下一次发布'
        required: false
        default: ''
      force_run:
        description: '无视周末/发布窗口限制强制执行，填 true'
        required: false
        default: ''

jobs:
  tagging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python blind_test_tagging.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          TARGET_RELEASE_DATE: ${{ github.event.inputs.target_date }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
