name: 每日验收巡检

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 2点 = 北京时间上午10点，可自行调整
  workflow_dispatch:        # 允许在 Actions 页面手动点按钮立刻跑一次，方便测试
    inputs:
      force_send:
        description: '强制发送测试消息（跳过日期判断逻辑）'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check_and_notify.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BEEHIVE_WEBHOOK_YANSHOU: ${{ secrets.BEEHIVE_WEBHOOK_YANSHOU }}
          BEEHIVE_WEBHOOK_P1_NODE: ${{ secrets.BEEHIVE_WEBHOOK_P1_NODE }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
