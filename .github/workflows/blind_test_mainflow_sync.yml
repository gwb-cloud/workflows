name: 同步是否主流程并打抽检标记

on:
  workflow_dispatch:
    inputs:
      table_name:
        description: '目标验收表名，留空则默认当月（例 M10验收表）'
        required: false
        default: ''
      tag_values:
        description: '要打的抽检版本号，逗号分隔'
        required: false
        default: 'MACSP16-1015,MACSP17-1029'
      confirm:
        description: '填 yes 才真正写表，留空只做预演（DRY RUN）'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python blind_test_mainflow_sync.py
        env:
          FEISHU_APP_ID_CLI: ${{ secrets.FEISHU_APP_ID_CLI }}
          FEISHU_APP_SECRET_CLI: ${{ secrets.FEISHU_APP_SECRET_CLI }}
          TARGET_TABLE_NAME: ${{ github.event.inputs.table_name }}
          TAG_VALUES: ${{ github.event.inputs.tag_values }}
          CONFIRM_WRITE: ${{ github.event.inputs.confirm }}
